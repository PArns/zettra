# Zettra production topology (§13.1). `web` is the only public entrypoint.
# Dev overrides live in docker-compose.override.yml (auto-merged by compose).
# Coolify: deploy this file as-is. Coolify injects env, provides its own Traefik proxy, and
# persists the named volumes below across redeploys. Point the domain at `web` (port 80) and
# set WEB_PORT if you also want a published host port. GPU: add docker-compose.gpu.yml.

services:
  postgres:
    # MUST be the pgvector image — stock postgres:16 lacks the vector extension (§13.2).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume → data survives redeploys/container recreation (persistence).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist to disk so queued jobs survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      # Keep the model resident to avoid bimodal latency (§14.5).
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ['CMD-SHELL', 'ollama list || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  # One-shot companion: pull the embedding + local LLM models once into the shared volume, then
  # exit (§13.2). Idempotent — re-pulling an existing model is a no-op.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - 'ollama pull ${EMBEDDING_MODEL:-bge-m3} && ollama pull ${LLM_MODEL:-qwen2.5:7b-instruct}'
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OLLAMA_URL: ${OLLAMA_URL}
      # Listening port is env-configurable (defaults to 3000).
      PORT: ${PORT:-3000}
      UPLOAD_DIR: /data/uploads
    volumes:
      # Uploaded files persist across redeploys.
      - uploads:/data/uploads
    expose:
      - ${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # Entrypoint runs migrations (incl. CREATE EXTENSION vector + HNSW) before boot (§13.3).

  collab:
    build:
      context: .
      dockerfile: apps/collab/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      APP_SECRET: ${APP_SECRET}
      SERVER_INTERNAL_URL: ${SERVER_INTERNAL_URL:-http://server:3000}
      COLLAB_PORT: ${COLLAB_PORT:-1234}
    expose:
      - ${COLLAB_PORT:-1234}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
      - collab
    # Public entrypoint. On Coolify, point the domain here (container port 80); WEB_PORT only
    # matters for a directly published host port (default 8080).
    expose:
      - '80'
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to IPv6 ::1 first, but
      # nginx listens on IPv4 only (`listen 80;`), so `localhost` gives a false "unhealthy".
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  ollama:
  uploads:
