# nginx is the single public entrypoint (§13.1). Serves the SPA and reverse-proxies
# /api → server and /collab (WebSocket) → collab. server/collab are NOT exposed publicly.

upstream zettra_server {
  server server:3000;
}
upstream zettra_collab {
  server collab:1234;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # File uploads (§8.3): images/CSVs dropped into notes go through /api/uploads. nginx's default
  # body cap is 1 MB, which 413s any real photo — lift it to match the server's 25 MB multipart
  # limit (+ multipart overhead headroom).
  client_max_body_size 30m;

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached, or a deploy's new content-hashed asset references are
  # ignored and the browser keeps running a stale bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  # Content-hashed build assets are immutable — cache them hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # API.
  location /api/ {
    proxy_pass http://zettra_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Collab WebSocket (Yjs). Requires Upgrade/Connection headers.
  location /collab {
    proxy_pass http://zettra_collab;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
